<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Dodge traffic in Neon Drift, an original 3D arcade racing game for desktop and mobile browsers.">
  <title>Neon Drift: 3D Car Racing</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080b1b;color:#fff;font:600 15px system-ui,sans-serif}
    #game{position:relative;width:100%;height:100%;min-height:320px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:absolute;inset:env(safe-area-inset-top,0) 0 auto;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;text-shadow:0 2px 6px #000}
    #stats{display:flex;flex-wrap:wrap;gap:8px 14px}.stat{font-size:13px;color:#dbeafe}.stat strong{font-size:17px;color:#fff}
    button{min-height:44px;border:1px solid #ffffff3b;border-radius:11px;background:#11162d;color:#fff;font:700 14px system-ui,sans-serif;padding:8px 14px;cursor:pointer;touch-action:manipulation}
    button:hover{background:#29254d}button:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
    #mobile{position:absolute;z-index:2;inset:auto 0 max(10px,env(safe-area-inset-bottom)) 0;display:none;align-items:center;justify-content:center;gap:16px}
    #mobile button{min-width:76px;min-height:50px;background:#11162ddd;font-size:22px}
    #overlay{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(145deg,#080b1be0,#231145dc);backdrop-filter:blur(7px);text-align:center}
    #overlay[hidden]{display:none}.card{width:min(440px,100%);padding:24px;border:1px solid #ffffff33;border-radius:22px;background:#101329f2;box-shadow:0 24px 80px #0008}
    .eyebrow{margin:0 0 8px;color:#f0abfc;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(28px,7vw,42px);line-height:1.05}.card p:not(.eyebrow){color:#d1d5db;line-height:1.55}.primary{margin-top:8px;background:#fcd34d;color:#111827;border:0}
    #hint{position:absolute;z-index:2;inset:auto 10px 8px;text-align:center;color:#cbd5e1;font-size:12px;text-shadow:0 1px 5px #000}
    @media(max-width:600px){#mobile{display:flex}#hint{bottom:68px}#hud{padding:9px}.stat{font-size:11px}#stats{gap:4px 9px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="game" aria-label="Neon Drift 3D arcade racing game">
    <canvas id="scene" aria-label="Three-dimensional neon road. Change lanes to avoid traffic."></canvas>
    <div id="hud">
      <div id="stats">
        <span class="stat">Distance <strong id="distance">0 m</strong></span>
        <span class="stat">Best <strong id="best">0 m</strong></span>
        <span class="stat">Speed <strong id="speed">0</strong></span>
      </div>
      <button id="pause" type="button" aria-label="Pause game">Pause</button>
    </div>
    <div id="mobile">
      <button type="button" data-command="left" aria-label="Steer left">←</button>
      <button type="button" data-command="right" aria-label="Steer right">→</button>
    </div>
    <p id="hint">A / D or ← / → to change lanes · P to pause · avoid the traffic</p>
    <div id="overlay">
      <div class="card">
        <p class="eyebrow">MT Games · 3D racer</p>
        <h1 id="heading">Neon Drift</h1>
        <p id="description">Read the road, change lanes early, and keep clear of the traffic as the pace climbs.</p>
        <button id="action" class="primary" type="button">Start driving</button>
      </div>
    </div>
  </main>
  <script src="/game/three.min.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas: $("scene"), antialias: (navigator.hardwareConcurrency || 4) > 4, powerPreference: "high-performance" });
      } catch (error) {
        $("heading").textContent = "WebGL is unavailable";
        $("description").textContent = "Neon Drift needs WebGL for its 3D road. Try an up-to-date browser with hardware acceleration enabled.";
        $("action").hidden = true;
        console.error("Could not initialize Neon Drift WebGL.", error);
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x100b28);
      scene.fog = new THREE.Fog(0x100b28, 26, 115);
      const camera = new THREE.PerspectiveCamera(54, 1, 0.1, 160);
      camera.position.set(0, 7, 13);
      scene.add(new THREE.HemisphereLight(0xe4d5ff, 0x14162e, 1.3));
      const moon = new THREE.DirectionalLight(0xf0abfc, 1.4);
      moon.position.set(-7, 12, 8);
      moon.castShadow = true;
      moon.shadow.mapSize.set(512, 512);
      scene.add(moon);

      const mat = (color, roughness = 0.55, metalness = 0.12, emissive = 0x000000) => new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive });
      const roadMat = mat(0x17192f, 0.88);
      const cyan = mat(0x22d3ee, 0.34, 0.3, 0x064e5a);
      const pink = mat(0xf0abfc, 0.34, 0.25, 0x5b215f);
      const segments = [];
      for (let index = 0; index < 10; index++) {
        const segment = new THREE.Group();
        segment.position.z = -index * 20;
        const road = new THREE.Mesh(new THREE.BoxGeometry(12, 0.36, 20), roadMat);
        road.position.y = -0.22;
        road.receiveShadow = true;
        segment.add(road);
        for (const x of [-5.8, 5.8]) {
          const strip = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.09, 20), cyan);
          strip.position.set(x, 0.02, 0);
          segment.add(strip);
        }
        for (const x of [-2, 2]) {
          const dash = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.03, 5), mat(0x9693bc));
          dash.position.set(x, 0.01, 0);
          segment.add(dash);
        }
        scene.add(segment);
        segments.push(segment);
      }

      const city = new THREE.Group();
      for (let index = 0; index < 24; index++) {
        const side = index % 2 ? 1 : -1;
        const height = 5 + (index * 7 % 13);
        const building = new THREE.Mesh(new THREE.BoxGeometry(3 + index % 3, height, 5 + index % 4), mat(index % 3 ? 0x252447 : 0x34204d, 0.85));
        building.position.set(side * (10 + index % 3), height / 2 - 0.4, -index * 10 - 8);
        city.add(building);
        for (let windowIndex = 0; windowIndex < 3; windowIndex++) {
          const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.45, 0.06), mat(windowIndex % 2 ? 0x22d3ee : 0xf0abfc, 0.3, 0.2, windowIndex % 2 ? 0x0e7490 : 0x86198f));
          windowMesh.position.set(building.position.x - side * 0.4 + windowIndex * 0.42, 0.5 + windowIndex % 2, building.position.z + 2.55 + index % 4 / 2);
          city.add(windowMesh);
        }
      }
      scene.add(city);

      function makeCar(color, isPlayer) {
        const car = new THREE.Group();
        const bodyMat = mat(color, 0.36, 0.27, isPlayer ? color : 0x000000);
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.5, 3.25), bodyMat);
        body.position.y = 0.6;
        car.add(body);
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.22, 1.1), bodyMat);
        hood.position.set(0, 0.85, -0.86);
        car.add(hood);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.58, 1.35), mat(isPlayer ? 0x9de8f5 : 0x9bb7da, 0.22, 0.3));
        cabin.position.set(0, 1.08, 0.28);
        car.add(cabin);
        for (const x of [-0.75, 0.75]) for (const z of [-1.03, 1.08]) {
          const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.31, 0.17, 12), mat(0x10121c, 0.93));
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, 0.34, z);
          car.add(wheel);
        }
        for (const x of [-0.54, 0.54]) {
          const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.12, 0.06), mat(isPlayer ? 0xfde68a : 0xffe4e6, 0.3, 0.1, isPlayer ? 0xf59e0b : 0x9f1239));
          lamp.position.set(x, 0.68, -1.65);
          car.add(lamp);
        }
        return car;
      }
      const player = makeCar(0xf43f5e, true);
      player.position.set(0, 0, 3.5);
      player.traverse((part) => { if (part.isMesh) part.castShadow = true; });
      scene.add(player);

      const game = { phase: "ready", lane: 1, laneX: 0, distance: 0, speed: 26, nextSpawn: 0.8, time: 0, last: 0, lastUi: 0, best: 0, quality: "medium", vibration: false, traffic: [] };
      try { game.best = Number(localStorage.getItem("mt-racing-best")) || 0; }
      catch (error) { console.warn("Could not read Neon Drift progress.", error); }
      $("best").textContent = `${game.best} m`;
      function emit(type, detail) { parent.postMessage({ type, detail }, location.origin); }
      window.addEventListener("pointerdown", () => emit("mt-game-interaction"), { once: true });
      window.addEventListener("keydown", () => emit("mt-game-interaction"), { once: true });
      function resize() {
        const box = $("game").getBoundingClientRect();
        const cap = game.quality === "low" ? 1 : game.quality === "high" ? 2 : 1.5;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, cap));
        renderer.shadowMap.enabled = game.quality === "high";
        moon.castShadow = game.quality !== "low";
        renderer.setSize(box.width, box.height, false);
        camera.aspect = box.width / Math.max(1, box.height);
        camera.updateProjectionMatrix();
      }
      function setPhase(phase) {
        game.phase = phase;
        emit("mt-game-phase", { phase });
        $("overlay").hidden = phase === "running";
        $("pause").textContent = phase === "paused" ? "Resume" : "Pause";
        if (phase === "ready") {
          $("heading").textContent = "Neon Drift";
          $("description").textContent = "Read the road, change lanes early, and keep clear of the traffic as the pace climbs.";
          $("action").textContent = "Start driving";
        } else if (phase === "paused") {
          $("heading").textContent = "Pit stop";
          $("description").textContent = "Your run is waiting. Resume when you are ready.";
          $("action").textContent = "Resume race";
        } else if (phase === "over") {
          $("heading").textContent = `${Math.floor(game.distance)} metres`;
          $("description").textContent = "Traffic caught up. Look farther down the road and choose your lane earlier next run.";
          $("action").textContent = "Race again";
        }
      }
      function finish() {
        game.distance = Math.floor(game.distance);
        if (game.distance > game.best) {
          game.best = game.distance;
          try { localStorage.setItem("mt-racing-best", String(game.best)); }
          catch (error) { console.warn("Could not save Neon Drift best distance.", error); }
        }
        $("best").textContent = `${game.best} m`;
        emit("mt-game-engine", { active: false });
        emit("mt-game-sound", { frequency: 100, duration: 0.3, type: "sawtooth" });
        if (game.vibration && navigator.vibrate) navigator.vibrate([40, 35, 40]);
        setPhase("over");
      }
      function start() {
        emit("mt-game-interaction");
        game.lane = 1; game.laneX = 0; game.distance = 0; game.speed = 26; game.nextSpawn = 0.65; game.time = 0;
        game.traffic.forEach((car) => scene.remove(car.mesh));
        game.traffic = [];
        $("distance").textContent = "0 m";
        setPhase("running");
      }
      function command(action) {
        if (action === "start" || action === "restart") { start(); return; }
        if (action === "pause") {
          if (game.phase === "running") {
            setPhase("paused");
            emit("mt-game-engine", { active: false });
          } else if (game.phase === "paused") {
            setPhase("running");
            emit("mt-game-engine", { active: true, frequency: 240 + game.speed * 5 });
          }
          return;
        }
        if (game.phase !== "running") return;
        if (action === "left" || action === "right") {
          const nextLane = action === "left" ? Math.max(0, game.lane - 1) : Math.min(2, game.lane + 1);
          if (nextLane !== game.lane) emit("mt-game-sound", { frequency: 640, duration: 0.16, type: "sawtooth" });
          game.lane = nextLane;
        }
      }
      const colors = [0xfbbf24, 0x8b5cf6, 0x22c55e, 0x38bdf8, 0xfb7185];
      function spawnTraffic() {
        const lane = Math.floor(Math.random() * 3);
        const mesh = makeCar(colors[Math.floor(Math.random() * colors.length)], false);
        mesh.scale.setScalar(0.82);
        mesh.position.set((lane - 1) * 4, 0, -56);
        mesh.traverse((part) => { if (part.isMesh) part.castShadow = true; });
        scene.add(mesh);
        game.traffic.push({ mesh, lane, checked: false });
      }
      function update(dt, now) {
        if (game.phase === "running") {
          game.time += dt;
          game.speed = 26 + Math.min(24, game.time * 0.44);
          game.distance += dt * game.speed * 0.75;
          game.nextSpawn -= dt;
          if (game.nextSpawn <= 0) {
            spawnTraffic();
            game.nextSpawn = Math.max(0.48, 1.25 - game.time / 105) + Math.random() * 0.26;
          }
          const targetX = (game.lane - 1) * 4;
          game.laneX += (targetX - game.laneX) * Math.min(1, dt * 10);
          player.position.x = game.laneX;
          player.rotation.z = (targetX - game.laneX) * -0.025;
          for (const traffic of game.traffic) {
            traffic.mesh.position.z += game.speed * dt;
            if (!traffic.checked && traffic.mesh.position.z >= 2.7) {
              traffic.checked = true;
              if (traffic.lane === game.lane) finish();
            }
          }
          game.traffic = game.traffic.filter((traffic) => {
            if (traffic.mesh.position.z < 14) return true;
            scene.remove(traffic.mesh);
            return false;
          });
          for (const segment of segments) {
            segment.position.z += game.speed * dt;
            if (segment.position.z > 20) segment.position.z -= 200;
          }
          city.position.z += game.speed * dt * 0.55;
          if (city.position.z > 12) city.position.z -= 240;
          if (now - game.lastUi > 100) {
            $("distance").textContent = `${Math.floor(game.distance)} m`;
            $("speed").textContent = `${Math.floor(game.speed * 7)} km/h`;
            game.lastUi = now;
          }
          if (now - game.last > 160) {
            emit("mt-game-engine", { active: true, frequency: 180 + game.speed * 6 });
            game.last = now;
          }
        }
        camera.position.x += (game.laneX * 0.35 - camera.position.x) * Math.min(1, dt * 2.2);
        camera.lookAt(game.laneX * 0.18, 0.7, -13);
        renderer.render(scene, camera);
      }
      let last = 0;
      function frame(now) {
        requestAnimationFrame(frame);
        const dt = last ? Math.min(0.045, (now - last) / 1000) : 0;
        last = now;
        update(dt, now);
      }
      let swipeStart = null;
      $("scene").addEventListener("pointerdown", (event) => { swipeStart = event.clientX; });
      $("scene").addEventListener("pointerup", (event) => {
        if (swipeStart === null) return;
        const delta = event.clientX - swipeStart;
        if (Math.abs(delta) > 24) command(delta < 0 ? "left" : "right");
        swipeStart = null;
      });
      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight"].includes(event.key)) event.preventDefault();
        if (["ArrowLeft", "a", "A"].includes(event.key)) command("left");
        else if (["ArrowRight", "d", "D"].includes(event.key)) command("right");
        else if (["p", "P", "Escape"].includes(event.key)) command("pause");
      });
      window.addEventListener("blur", () => { if (game.phase === "running") command("pause"); });
      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || !event.data) return;
        if (event.data.type === "mt-game-command") command(event.data.command);
        if (event.data.type === "mt-game-preferences" && event.data.preferences) {
          game.quality = event.data.preferences.graphics || "medium";
          game.vibration = event.data.preferences.vibration === true;
          resize();
        }
      });
      $("pause").addEventListener("click", () => command("pause"));
      $("action").addEventListener("click", () => command(game.phase === "paused" ? "pause" : "start"));
      document.querySelectorAll("[data-command]").forEach((button) => button.addEventListener("click", () => command(button.dataset.command)));
      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
