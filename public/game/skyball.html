<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sky Ball: 3D Challenge</title><meta name="description" content="Roll a ball across floating sky platforms in 40 original 3D levels. Play free in your browser."><style>
html,body{margin:0;height:100%;overflow:hidden;background:#6ec6ff;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:10px;align-items:center;padding:10px 12px;color:#fff;font-weight:700;text-shadow:0 1px 3px #0006;pointer-events:none;flex-wrap:wrap}
#hud button{pointer-events:auto;background:#0008;color:#fff;border:0;border-radius:10px;font-size:18px;padding:6px 12px;cursor:pointer}
#bar{flex:1 1 100%;height:6px;background:#fff4;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#ffd23f}
#ov{position:fixed;inset:0;background:linear-gradient(145deg,#071b42eF,#14558ee8);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;gap:8px;overflow:auto}
#ov h1{margin:0;font-size:clamp(32px,8vw,56px)}#ov p{margin:0;max-width:460px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(5,minmax(48px,64px));gap:8px;margin:10px 0;max-width:calc(100vw - 28px)}
#ov button{font-size:18px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:#ffd23f;color:#222;cursor:pointer;min-width:56px;box-shadow:0 5px 0 #bc8210;transition:transform .15s,filter .15s}#ov button:hover{transform:translateY(-2px);filter:brightness(1.05)}
#ov button:disabled{background:#6a7aa0;color:#cde;cursor:not-allowed}#ov small{display:block;font-size:11px;font-weight:400}
#toast{position:fixed;bottom:22%;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:10px 16px;border-radius:12px;max-width:80%;text-align:center;display:none}
#joy{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:min(130px,28vw);height:min(130px,28vw);border-radius:50%;background:#071b4270;border:2px solid #fff8;display:none;touch-action:none;backdrop-filter:blur(4px)}
#joy i{position:absolute;left:calc(50% - 20px);top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;background:#fffc;box-shadow:0 2px 12px #0005}
@media(max-width:520px){#hud{gap:5px;padding:8px;font-size:13px}#hud button{font-size:16px;padding:6px 9px}.grid{grid-template-columns:repeat(5,minmax(42px,52px));gap:5px}#ov button{padding:10px 12px;font-size:16px}#ov p{font-size:14px}}
</style></head><body><canvas id="c"></canvas>
<div id="hud"><span id="lv"></span><span id="tm">0.0s</span><span id="st">★ 0</span><span id="sc">0</span><span style="flex:1"></span><button id="mu" aria-label="Mute">🔊</button><button id="pa" aria-label="Pause">⏸</button><div id="bar"><i></i></div></div>
<div id="joy"><i></i></div><div id="toast"></div><div id="ov"></div>
<script src="/game/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),R=.5;
// P plain, C checkpoint, B bridge, N narrow bridge, M gap w/ forward-back platform, X gap w/ sideways platform, R rotating bar, D drop, F finish
const LV=[
"PBCPF","PBCBPCDF","PMCPBCF","PRCBMCPRF","PXCBDCMRF","PNCMXCRDF","PBNCMXCRPNF","PRCNDCXMCRBF","PNCXMCRNCMXRF","PNRCXMCNRCMXPNCRRF",
"PBCNCPBF","PXCNRMCPF","PNCDPNCBF","PMCPMCRNF","PRBCNRPCF","PNMXCBNMRF","PBNPBXCNF","PXCDXCPRMF","PNCNBNCRPF","PBCNPRMXCPF",
"PNMCDNPNF","PRNRCMPXBF","PNCPMCRNF","PBNCPXCNF","PNBNBMCNCPF","PNRCRNRMCPF","PMCPXCNPRF","PBNXCNPRMNF","PMCPMXCNRPF","PNBXCNRPMF",
"PNBCPXMNRF","PRCNRXPNRMF","PNCNPXCPMF","PXNCPXCBNMRF","PNMCPRNBXNF","PMXNRCPRBNF","PNCNBNMXRCPF","PMXCPNBRDPNF","PNMRXCBNPNRMF","PRNMXCPXNRBCF"
];
const COL=[0x4caf50,0xff9800,0x29b6f6,0xab47bc,0xef5350,0x26a69a,0xffca28,0x7e57c2,0xec407a,0x66bb6a];
let save={best:{},bestScore:{},completed:{},unlocked:1,muted:false,seen:false};
try{const raw=JSON.parse(localStorage.getItem('sb')||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw)){for(let i=0;i<40;i++){const bt=Number(raw.best&&raw.best[i]),bs=Number(raw.bestScore&&raw.bestScore[i]);if(Number.isFinite(bt)&&bt>0)save.best[i]=bt;if(Number.isFinite(bs)&&bs>=0)save.bestScore[i]=bs;if(raw.completed&&raw.completed[i]===true)save.completed[i]=true}const unlocked=+raw.unlocked;save.unlocked=Number.isInteger(unlocked)&&unlocked>=1&&unlocked<=40?unlocked:1;save.muted=!!raw.muted;save.seen=!!raw.seen}}catch(e){}
const store=()=>{try{localStorage.setItem('sb',JSON.stringify(save))}catch(e){}};
let ren;try{ren=new THREE.WebGLRenderer({canvas:$('c'),antialias:(navigator.hardwareConcurrency||4)>4})}catch(e){}
if(!ren){$('hud').style.display='none';$('ov').innerHTML='<h1>WebGL needed</h1><p>Your browser or device doesn’t support WebGL, which this 3D game requires. Try updating your browser or switching to another one.</p>';throw 0}
ren.setPixelRatio(Math.min(devicePixelRatio,(navigator.hardwareConcurrency||4)>4?1.75:1));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x6ec6ff);scene.fog=new THREE.Fog(0x9bd8ff,40,130);
const cam=new THREE.PerspectiveCamera(60,1,.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x88aadd,.85));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(10,30,10);scene.add(sun);
const ball=new THREE.Mesh(new THREE.SphereGeometry(R,24,16),new THREE.MeshLambertMaterial({color:0xff3d71}));scene.add(ball);
const deco=new THREE.Group();scene.add(deco);
for(let i=0;i<30;i++){const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xffffff});for(let k=0;k<3;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*2,10,8),m);s.position.set(k*2.5,Math.random(),Math.random()*2);g.add(s)}g.position.set((Math.random()-.5)*160,-15+Math.random()*40,-Math.random()*260);deco.add(g)}
for(let i=0;i<8;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(6,8,8),new THREE.MeshLambertMaterial({color:0x8d6e63}));c.rotation.x=Math.PI;c.position.set((i%2?1:-1)*(25+Math.random()*25),-25-Math.random()*10,-i*35);const t=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.8,8),new THREE.MeshLambertMaterial({color:0x81c784}));t.position.set(c.position.x,c.position.y+4.2,c.position.z);deco.add(c,t)}
let lvl=null,grp=new THREE.Group(),boxes=[],stars=[],cps=[],fin,minY,len,n=0,state='menu',t=0,p=new THREE.Vector3(),v=new THREE.Vector3(),grounded=false,ground=null,got=0,spawn=null,inp={x:0,y:0};scene.add(grp);
function add(x,y,z,w,h,d,col,o={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);grp.add(m);boxes.push({m,x,y,z,bx:x,bz:z,px:x,pz:z,hx:w/2,hy:h/2,hz:d/2,vx:0,vz:0,ang:0,mv:o.mv,rot:o.rot||0})}
function marker(x,y,z,col,r){const g=new THREE.Group(),d=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.12,24),new THREE.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:.6})),b=new THREE.Mesh(new THREE.CylinderGeometry(r*.4,r*.4,5,12),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.25}));b.position.y=2.5;g.add(d,b);g.position.set(x,y+.06,z);grp.add(g);return g}
function addStar(x,y,z){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshLambertMaterial({color:0xffd23f,emissive:0xffa000}));s.position.set(x,y,z);grp.add(s);stars.push({m:s,on:true})}
function build(i){grp.clear();boxes=[];stars=[];cps=[];got=0;const d=Math.min(i/20,1.5),col=COL[i%COL.length];let z=0,y=0;
for(const ch of LV[i]){
 if('PCF'.includes(ch)){add(0,y-.5,z-5,7,1,10,ch=='F'?0x80deea:col);if(ch=='C')cps.push({x:0,y:y+1,z:z-5,g:marker(0,y,z-5,0xffffff,1.2),on:false});if(ch=='F'){fin={x:0,y,z:z-5};marker(0,y,z-5,0x00e676,2.4)}z-=10}
 else if(ch=='B'||ch=='N'){const w=ch=='B'?Math.max(1.4,2.4-d*1.1):1.1,l=ch=='B'?14:12;add(0,y-.5,z-l/2,w,1,l,0xffe0b2);addStar(0,y+1,z-l/2);z-=l}
 else if(ch=='M'){add(0,y-.6,z-2.6,4,1,4,0xff7043,{mv:{a:'z',amp:1.2,sp:.8+d*.9}});addStar(0,y+1.2,z-2.6);z-=5.2}
 else if(ch=='X'){add(0,y-.6,z-2,3,1,4.4,0xff7043,{mv:{a:'x',amp:3,sp:.7+d*.9}});addStar(0,y+1.2,z-2);z-=4}
 else if(ch=='R'){add(0,y-.5,z-5,8,1,10,col);add(0,y+.4,z-5,6,.8,.8,0xd32f2f,{rot:(i%2?-1:1)*(1+d*1.3)});addStar(-3,y+1,z-3);z-=10}
 else if(ch=='D'){y-=1.5;add(0,y-.5,z-5,7,1,10,col);z-=10}
}
minY=Math.min(...boxes.map(b=>b.y))-9;len=-z;spawn={x:0,y:1,z:-3};respawn(spawn);t=0}
function respawn(s){p.set(s.x,s.y,s.z);v.set(0,0,0)}
function col(b){const c=Math.cos(b.ang),s=Math.sin(b.ang),rx=p.x-b.x,rz=p.z-b.z,ry=p.y-b.y,lx=rx*c-rz*s,lz=rx*s+rz*c;
 const dx=lx-cl(lx,-b.hx,b.hx),dy=ry-cl(ry,-b.hy,b.hy),dz=lz-cl(lz,-b.hz,b.hz),d2=dx*dx+dy*dy+dz*dz;if(d2>=R*R)return;
 let d=Math.sqrt(d2),nx=0,ny=1,nz=0;if(d>1e-5){nx=dx/d;ny=dy/d;nz=dz/d}else d=0;
 const pen=R-d,wx=nx*c+nz*s,wz=-nx*s+nz*c;p.x+=wx*pen;p.y+=ny*pen;p.z+=wz*pen;
 let pvx=b.vx,pvz=b.vz;if(b.rot){pvx=b.rot*rz;pvz=-b.rot*rx}
 const vn=(v.x-pvx)*wx+v.y*ny+(v.z-pvz)*wz;if(vn<0){const k=vn*1.15;v.x-=k*wx;v.y-=k*ny;v.z-=k*wz;if(vn<-6)snd(180,.06)}
 if(ny>.6){grounded=true;ground=b}}
function step(dt){t+=dt;
 for(const b of boxes){b.px=b.x;b.pz=b.z;if(b.mv){const o=Math.sin(b.mv.sp*t)*b.mv.amp,w=Math.cos(b.mv.sp*t)*b.mv.amp*b.mv.sp;if(b.mv.a=='x'){b.x=b.bx+o;b.vx=w}else{b.z=b.bz+o;b.vz=w}}if(b.rot)b.ang+=b.rot*dt}
 v.x+=inp.x*30*dt;v.z+=inp.y*30*dt;v.y-=26*dt;
 const sp=Math.hypot(v.x,v.z);if(sp>13){v.x*=13/sp;v.z*=13/sp}
 p.addScaledVector(v,dt);grounded=false;ground=null;for(const b of boxes)col(b);
 if(ground&&ground.mv){p.x+=ground.x-ground.px;p.z+=ground.z-ground.pz}
 if(grounded){const f=Math.pow(.55,dt);v.x*=f;v.z*=f}
 for(const s of stars)if(s.on&&s.m.position.distanceTo(p)<1.1){s.on=false;s.m.visible=false;got++;snd(880,.12)}
 for(const c of cps)if(!c.on&&Math.hypot(c.x-p.x,c.z-p.z)<2.5&&Math.abs(c.y-p.y)<2){c.on=true;spawn=c;c.g.children[0].material.color.set(0xffd23f);c.g.children[0].material.emissive.set(0xffd23f);snd(660,.15)}
 if(p.y<minY){respawn(spawn);snd(120,.25)}
 if(grounded&&Math.hypot(fin.x-p.x,fin.z-p.z)<2.5&&p.y<fin.y+1.3)done()}
function done(){state='done';const bt=save.best[n];if(!bt||t<bt)save.best[n]=t;save.completed[n]=true;save.bestScore[n]=Math.max(Number(save.bestScore[n])||0,got*100);save.unlocked=Math.max(save.unlocked,Math.min(40,n+2));store();snd(1000,.4);
 ov.innerHTML=`<h1>Level ${n+1} complete!</h1><p>Time ${t.toFixed(1)}s · Stars ${got}/${stars.length}<br>Best ${save.best[n].toFixed(1)}s</p>`+(n<39?'<button data-a=next>Next level</button>':'<p>You conquered all 40 levels!</p>')+'<button data-a=restart>Replay</button><button data-a=menu>Menu</button>';ov.style.display='flex'}
const ov=$('ov');
function menu(){state='menu';let h='<h1>Sky Ball</h1><p><b>3D Challenge</b></p><div class=grid>';for(let i=0;i<40;i++)h+=`<button data-a=go data-l=${i} ${i<save.unlocked?'':'disabled'} aria-label="Level ${i+1}${save.completed[i]?' completed':i<save.unlocked?' unlocked':' locked'}">${i+1}${save.completed[i]?' Done':''}<small>${save.best[i]?save.best[i].toFixed(1)+'s':i<save.unlocked?'Open':'Locked'}</small></button>`;
 ov.innerHTML=h+'</div><p style="font-size:14px">Roll with WASD or arrow keys (or the on-screen stick). Reach the green pad, grab stars, and use glowing checkpoints—if you fall you restart from the last one. P or Esc pauses.</p>';ov.style.display='flex'}
function start(i){n=i;build(i);state='play';ov.style.display='none';$('lv').textContent=`Level ${i+1}/40`;if(!save.seen){save.seen=true;store();toast('Roll with WASD / arrows or the stick. Reach the green pad. Falling returns you to your last checkpoint.')}}
function pause(on){if(state=='play'&&on){state='pause';ov.innerHTML='<h1>Paused</h1><button data-a=resume>Resume</button><button data-a=restart>Restart</button><button data-a=menu>Menu</button>';ov.style.display='flex'}else if(state=='pause'&&!on){state='play';ov.style.display='none'}}
ov.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;initAudio();const a=b.dataset.a;if(a=='go')start(+b.dataset.l);else if(a=='next')start(n+1);else if(a=='restart')start(n);else if(a=='resume')pause(false);else if(a=='menu')menu()};
$('pa').onclick=()=>pause(state=='play');$('mu').onclick=()=>{initAudio();save.muted=!save.muted;$('mu').textContent=save.muted?'🔇':'🔊';store()};$('mu').textContent=save.muted?'🔇':'🔊';
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',6000)}
let ac;function initAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function snd(f,d){if(save.muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
const K={};addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key=='p'||e.key=='P'||e.key=='Escape'||e.key==' '){if(!e.repeat)pause(state=='play')}K[e.key.toLowerCase()]=1});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);addEventListener('blur',()=>pause(true));
let jx=0,jy=0;const joy=$('joy'),kn=joy.firstElementChild;
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)joy.style.display='block';
function jm(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-65)/45,y=(e.clientY-r.top-65)/45;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}jx=x;jy=y;kn.style.transform=`translate(${x*35}px,${y*35}px)`}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e);e.preventDefault()};joy.onpointermove=e=>{if(e.buttons||e.pressure)jm(e)};joy.onpointerup=joy.onpointercancel=()=>{jx=jy=0;kn.style.transform=''};
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now(),acc=0;const cp=new THREE.Vector3(0,6,9);
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state=='play'){inp.x=cl((K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+jx,-1,1);inp.y=cl((K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0)+jy,-1,1);acc+=dt;while(acc>=1/120&&state=='play'){step(1/120);acc-=1/120}
  $('tm').textContent=t.toFixed(1)+'s';$('st').textContent='★ '+got+'/'+stars.length;$('sc').textContent=got*100+' pts';$('bar').firstChild.style.width=cl(-p.z/len*100,0,100)+'%'}
 if(boxes.length){for(const b of boxes){b.m.position.set(b.x,b.y,b.z);b.m.rotation.y=b.ang}for(const s of stars)s.m.rotation.y+=dt*2;ball.position.copy(p);ball.rotation.x-=v.z*dt/R*0;
  const k=1-Math.exp(-4*dt);cp.x+=(p.x*.7-cp.x)*k;cp.y+=(p.y+6-cp.y)*k;cp.z+=(p.z+9-cp.z)*k;cam.position.copy(cp);cam.lookAt(p.x*.8,p.y,p.z-3)}
 ren.render(scene,cam)}
build(0);cp.set(0,6,6);menu();requestAnimationFrame(loop);
try{const q=+new URLSearchParams(location.search).get('level');if(q>=1&&q<=40&&q<=save.unlocked)start(q-1)}catch(e){}
</script></body></html>
